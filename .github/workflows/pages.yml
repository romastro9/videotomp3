name: Deploy VideoToMP3 V4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: videotomp3-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build verified V4 site
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf _site /tmp/ffmpeg-package /tmp/core-package /tmp/ffmpeg-core.mjs
          mkdir -p _site/assets/fonts _site/vendor/ffmpeg _site/vendor/ffmpeg-core
          mkdir -p /tmp/ffmpeg-package /tmp/core-package

          # Copy only the static project files into the Pages artifact.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

          # Restore and validate the exact Krasar Black WOFF2 supplied by the owner.
          cat font-parts/Krasar-Black.woff2.part*.b64 \
            | base64 --decode \
            > _site/assets/fonts/Krasar-Black.woff2

          python - <<'PY'
          from pathlib import Path
          font = Path("_site/assets/fonts/Krasar-Black.woff2").read_bytes()
          if len(font) < 10000 or font[:4] != b"wOF2":
              raise SystemExit("Krasar Black WOFF2 validation failed")
          print(f"Validated Krasar Black WOFF2: {len(font)} bytes")
          PY

          # Bundle the FFmpeg browser API and its module worker on the same origin.
          FFMPEG_TGZ="$(npm pack --silent @ffmpeg/ffmpeg@0.12.15 --pack-destination /tmp)"
          tar -xzf "/tmp/${FFMPEG_TGZ}" -C /tmp/ffmpeg-package
          cp -a /tmp/ffmpeg-package/package/dist/umd/. _site/vendor/ffmpeg/

          # The FFmpeg class worker is created with type=module. Its fallback uses
          # dynamic import(coreURL), so the core JavaScript MUST be the ESM build.
          CORE_TGZ="$(npm pack --silent @ffmpeg/core@0.12.10 --pack-destination /tmp)"
          tar -xzf "/tmp/${CORE_TGZ}" -C /tmp/core-package
          cp /tmp/core-package/package/dist/esm/ffmpeg-core.js _site/vendor/ffmpeg-core/ffmpeg-core.js
          cp /tmp/core-package/package/dist/esm/ffmpeg-core.wasm _site/vendor/ffmpeg-core/ffmpeg-core.wasm

          CLASS_WORKER="$(find _site/vendor/ffmpeg -maxdepth 1 -type f -name '*.js' ! -name 'ffmpeg.js' | head -n 1)"
          test -n "${CLASS_WORKER}"
          export CLASS_WORKER_BASENAME="$(basename "${CLASS_WORKER}")"

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          build = os.environ["BUILD_SHA"][:12]
          class_worker = os.environ["CLASS_WORKER_BASENAME"]
          html_path = Path("_site/index.html")
          converter_path = Path("_site/converter-v4.js")

          html = html_path.read_text(encoding="utf-8")

          # Remove every old converter or generated release asset.
          html = re.sub(
              r'\s*<script[^>]+(?:@ffmpeg/ffmpeg|vendor/ffmpeg|vendor/lame|converter-v2|converter-v3|converter-v4)[^>]*></script>',
              '',
              html,
              flags=re.IGNORECASE,
          )
          html = re.sub(
              r'\s*<link[^>]+href="(?:font|batch-v4)\.css(?:\?[^\"]*)?"[^>]*>',
              '',
              html,
              flags=re.IGNORECASE,
          )
          html = re.sub(
              r'\s*<meta[^>]+name="videotomp3-build"[^>]*>',
              '',
              html,
              flags=re.IGNORECASE,
          )

          html = re.sub(
              r'href="styles\.css(?:\?[^\"]*)?"',
              f'href="styles.css?v={build}"',
              html,
          )
          html = re.sub(
              r'src="app\.js(?:\?[^\"]*)?"',
              f'src="app.js?v={build}"',
              html,
          )

          styles_tag = f'  <link rel="stylesheet" href="styles.css?v={build}">'
          if styles_tag not in html:
              raise SystemExit("Unable to locate styles.css tag")
          html = html.replace(
              styles_tag,
              styles_tag
              + f'\n  <link rel="stylesheet" href="font.css?v={build}">'
              + f'\n  <link rel="stylesheet" href="batch-v4.css?v={build}">',
              1,
          )

          app_tag = f'  <script src="app.js?v={build}" defer></script>'
          if app_tag not in html:
              raise SystemExit("Unable to locate app.js tag")
          html = html.replace(
              app_tag,
              f'  <script src="vendor/ffmpeg/ffmpeg.js?v={build}" defer></script>\n'
              + app_tag
              + f'\n  <script src="converter-v4.js?v={build}" defer></script>',
              1,
          )
          html = html.replace(
              '</head>',
              f'  <meta name="videotomp3-build" content="{build}">\n</head>',
              1,
          )

          converter = converter_path.read_text(encoding="utf-8")
          if "__CLASS_WORKER__" not in converter:
              raise SystemExit("Class worker placeholder missing")
          converter = converter.replace("__CLASS_WORKER__", class_worker)

          worker_line = f"  const CLASS_WORKER_URL = new URL('vendor/ffmpeg/{class_worker}', document.baseURI).href;"
          if worker_line not in converter:
              raise SystemExit("Unable to locate generated class-worker line")
          converter = converter.replace(
              worker_line,
              worker_line
              + f'\n  const BUILD_ID = document.querySelector(\'meta[name="videotomp3-build"]\')?.content || "{build}";'
              + "\n  const withBuild = (url) => `${url}${url.includes('?') ? '&' : '?'}v=${encodeURIComponent(BUILD_ID)}`;",
              1,
          )

          replacements = {
              "classWorkerURL: CLASS_WORKER_URL,": "classWorkerURL: withBuild(CLASS_WORKER_URL),",
              "coreURL: `${ENGINE_BASE}ffmpeg-core.js`,": "coreURL: withBuild(`${ENGINE_BASE}ffmpeg-core.js`),",
              "wasmURL: `${ENGINE_BASE}ffmpeg-core.wasm`": "wasmURL: withBuild(`${ENGINE_BASE}ffmpeg-core.wasm`)",
          }
          for old, new in replacements.items():
              if old not in converter:
                  raise SystemExit(f"Unable to locate converter setting: {old}")
              converter = converter.replace(old, new, 1)

          html_path.write_text(html, encoding="utf-8")
          converter_path.write_text(converter, encoding="utf-8")
          PY

          # Fail the deployment if any required browser asset is missing or mismatched.
          test -s _site/assets/fonts/Krasar-Black.woff2
          test -s _site/vendor/ffmpeg/ffmpeg.js
          test -s "${CLASS_WORKER}"
          test -s _site/vendor/ffmpeg-core/ffmpeg-core.js
          test -s _site/vendor/ffmpeg-core/ffmpeg-core.wasm

          # Parse the copied core as an ES module and verify its default factory export.
          cp _site/vendor/ffmpeg-core/ffmpeg-core.js /tmp/ffmpeg-core.mjs
          node --input-type=module - <<'NODE'
          const module = await import('file:///tmp/ffmpeg-core.mjs');
          if (typeof module.default !== 'function') {
            throw new Error('FFmpeg ESM core has no default factory export');
          }
          console.log('Validated FFmpeg ESM core default export');
          NODE

          grep -q 'font.css' _site/index.html
          grep -q 'batch-v4.css' _site/index.html
          grep -q 'vendor/ffmpeg/ffmpeg.js' _site/index.html
          grep -q 'converter-v4.js' _site/index.html
          grep -q "${CLASS_WORKER_BASENAME}" _site/converter-v4.js
          grep -q 'withBuild(CLASS_WORKER_URL)' _site/converter-v4.js
          grep -q 'withBuild(`${ENGINE_BASE}ffmpeg-core.js`)' _site/converter-v4.js
          grep -q 'withBuild(`${ENGINE_BASE}ffmpeg-core.wasm`)' _site/converter-v4.js
          ! grep -q '__CLASS_WORKER__' _site/converter-v4.js
          ! grep -q '@ffmpeg/ffmpeg@0.11' _site/index.html

          echo "Built VideoToMP3 ${BUILD_SHA} with cache-busted ESM FFmpeg core"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
