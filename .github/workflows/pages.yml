name: Deploy VideoToMP3 V9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: videotomp3-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build isolated V9 release
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets/fonts

          cp index-v5.html _site/index.html
          cp \
            styles.css \
            font.css \
            batch-v4.css \
            favicon.svg \
            .nojekyll \
            theme-v6.js \
            ffmpeg-legacy-adapter.js \
            coi-bootstrap.js \
            coi-serviceworker.js \
            _site/
          cp converter-v4.js _site/converter-v9.js

          cat font-parts/Krasar-Black.woff2.part*.b64 \
            | base64 --decode \
            > _site/assets/fonts/Krasar-Black.woff2

          python - <<'PY'
          from pathlib import Path

          font = Path('_site/assets/fonts/Krasar-Black.woff2').read_bytes()
          if len(font) < 10000 or font[:4] != b'wOF2':
              raise SystemExit('Krasar Black WOFF2 validation failed')

          converter_path = Path('_site/converter-v9.js')
          converter = converter_path.read_text(encoding='utf-8')
          converter = converter.replace(
              "new URL('vendor/ffmpeg-core/', document.baseURI).href",
              "'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/'"
          )
          converter = converter.replace(
              "new URL('vendor/ffmpeg/__CLASS_WORKER__', document.baseURI).href",
              "new URL('ffmpeg-legacy-adapter.js?v=9', document.baseURI).href"
          )
          converter_path.write_text(converter, encoding='utf-8')

          print(f'Validated Krasar Black WOFF2: {len(font)} bytes')
          PY

          node --check _site/theme-v6.js
          node --check _site/ffmpeg-legacy-adapter.js
          node --check _site/coi-bootstrap.js
          node --check _site/coi-serviceworker.js
          node --check _site/converter-v9.js

          test -s _site/index.html
          test -s _site/assets/fonts/Krasar-Black.woff2
          test -s _site/ffmpeg-legacy-adapter.js
          test -s _site/coi-bootstrap.js
          test -s _site/coi-serviceworker.js
          test -s _site/converter-v9.js

          grep -q 'VideoToMP3 V9' _site/index.html
          grep -q 'coi-bootstrap.js?v=9' _site/index.html
          grep -q 'coi-serviceworker.js?v=' _site/coi-bootstrap.js
          grep -q 'window.crossOriginIsolated' _site/coi-bootstrap.js
          grep -q 'SharedArrayBuffer' _site/coi-bootstrap.js
          grep -q 'Cross-Origin-Opener-Policy' _site/coi-serviceworker.js
          grep -q 'Cross-Origin-Embedder-Policy' _site/coi-serviceworker.js
          grep -q 'credentialless' _site/coi-serviceworker.js
          grep -q '@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js' _site/coi-bootstrap.js
          grep -q '@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' _site/ffmpeg-legacy-adapter.js
          grep -q 'converter-v9.js' _site/coi-bootstrap.js
          grep -q 'window.FFmpegWASM' _site/ffmpeg-legacy-adapter.js
          ! grep -q '__CLASS_WORKER__' _site/converter-v9.js
          ! grep -q 'vendor/ffmpeg-core/' _site/converter-v9.js
          ! grep -q 'bootstrap-v5.js' _site/index.html
          ! grep -q 'blob:' _site/coi-bootstrap.js

          python - <<'PY'
          from pathlib import Path

          required = [
              'index.html',
              'styles.css',
              'font.css',
              'batch-v4.css',
              'theme-v6.js',
              'ffmpeg-legacy-adapter.js',
              'coi-bootstrap.js',
              'coi-serviceworker.js',
              'converter-v9.js',
              'assets/fonts/Krasar-Black.woff2',
          ]
          missing = [item for item in required if not Path('_site', item).is_file()]
          if missing:
              raise SystemExit(f'Missing V9 release files: {missing}')
          print('VideoToMP3 V9 isolated static artifact verified.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
