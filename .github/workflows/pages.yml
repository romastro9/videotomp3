name: Deploy VideoToMP3 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare private browser converter
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p vendor
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js" \
            --output vendor/lame.min.js

          python - <<'PY'
          import os
          from pathlib import Path

          build = os.environ.get("BUILD_SHA", "release")[:12]
          html_path = Path("index.html")
          css_path = Path("styles.css")

          html = html_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          font_links = """  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n"""

          if "fonts.googleapis.com" not in html:
              html = html.replace(
                  '  <link rel="stylesheet" href="styles.css">',
                  font_links + f'  <link rel="stylesheet" href="styles.css?v={build}">'
              )
          else:
              html = html.replace('href="styles.css"', f'href="styles.css?v={build}"')

          ffmpeg_tag = '  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js" defer></script>\n'
          html = html.replace(ffmpeg_tag, '')
          html = html.replace('src="app.js"', f'src="app.js?v={build}"')

          app_tag = f'  <script src="app.js?v={build}" defer></script>'
          browser_encoder_tags = (
              app_tag
              + f'\n  <script src="vendor/lame.min.js?v={build}" defer></script>'
              + f'\n  <script src="converter-v2.js?v={build}" defer></script>'
          )
          if "converter-v2.js" not in html:
              html = html.replace(app_tag, browser_encoder_tags)

          font_override = """

          @font-face {
            font-family: "Krasar Local";
            src: local("Krasar"), local("Krasar Regular");
            font-display: swap;
          }

          html,
          body,
          button,
          input,
          select,
          textarea {
            font-family: "Krasar Local", "Krasar", "Noto Sans Khmer", sans-serif !important;
          }
          """

          if 'font-family: "Krasar Local"' not in css:
              css += font_override

          html_path.write_text(html, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
