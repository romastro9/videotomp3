name: Deploy VideoToMP3 V5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: videotomp3-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static V5 release
        run: |
          set -euo pipefail
          rm -rf _site /tmp/ffmpeg-package
          mkdir -p _site/assets/fonts _site/vendor/ffmpeg /tmp/ffmpeg-package

          cp index-v5.html _site/index.html
          cp styles.css font.css batch-v4.css converter-v4.js bootstrap-v5.js favicon.svg .nojekyll _site/

          cat font-parts/Krasar-Black.woff2.part*.b64 \
            | base64 --decode \
            > _site/assets/fonts/Krasar-Black.woff2

          python - <<'PY'
          from pathlib import Path
          font = Path('_site/assets/fonts/Krasar-Black.woff2').read_bytes()
          if len(font) < 10000 or font[:4] != b'wOF2':
              raise SystemExit('Krasar Black WOFF2 validation failed')
          print(f'Validated Krasar Black WOFF2: {len(font)} bytes')
          PY

          PACKAGE_FILE="$(npm pack --silent @ffmpeg/ffmpeg@0.12.15 --pack-destination /tmp)"
          tar -xzf "/tmp/${PACKAGE_FILE}" -C /tmp/ffmpeg-package
          cp /tmp/ffmpeg-package/package/dist/umd/ffmpeg.js _site/vendor/ffmpeg/ffmpeg.js

          WORKER_FILE="$(find /tmp/ffmpeg-package/package/dist/umd -maxdepth 1 -type f -name '*.js' ! -name 'ffmpeg.js' | head -n 1)"
          test -n "${WORKER_FILE}"
          cp "${WORKER_FILE}" _site/vendor/ffmpeg/ffmpeg-worker.js

          node --check _site/bootstrap-v5.js
          node --check _site/converter-v4.js
          test -s _site/index.html
          test -s _site/assets/fonts/Krasar-Black.woff2
          test -s _site/vendor/ffmpeg/ffmpeg.js
          test -s _site/vendor/ffmpeg/ffmpeg-worker.js
          grep -q 'bootstrap-v5.js' _site/index.html
          grep -q 'ffmpeg-worker.js' _site/bootstrap-v5.js
          grep -q '@ffmpeg/core@0.12.10/dist/esm/' _site/bootstrap-v5.js

          echo 'VideoToMP3 V5 static release validated.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
